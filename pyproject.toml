[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "use-agentcanvas"
version = "0.1.2"
description = "Local editable workflow canvas for AI coding agents."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "AgentCanvas contributors" }]
keywords = ["ai-agents", "workflow", "canvas", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.urls]
Homepage = "https://github.com/uncoooloj/agentcanvas"
Repository = "https://github.com/uncoooloj/agentcanvas"
Issues = "https://github.com/uncoooloj/agentcanvas/issues"
Changelog = "https://github.com/uncoooloj/agentcanvas/releases"

[project.scripts]
agentcanvas = "agentcanvas.cli:main"

[tool.setuptools.packages.find]
include = ["agentcanvas*"]

[tool.setuptools.package-data]
agentcanvas = [
  "web/*",
  "web/assets/*",
  "templates/*",
  "templates/adapters/*",
  "demo_project/*",
  "demo_project/src/*",
  "demo_project/src/actions/*",
  "demo_project/src/jobs/*",
  "demo_project/src/routes/*",
  "demo_project/src/services/*",
  "demo_project/tests/*",
]
